# Kalman filter: expert-calibrated hyperparameters + data-driven Pearson correlation.
# Correlation matrix from python/correlation.py (sweep_data.h5, same-batch + cross-batch).
# Usage: --config python/config/kf_analytical.toml  (from repo root)

[kalman]
process_noise_per_ns            = 1e-8
min_measurement_variance        = 1e-18
initial_variance                = 1000.0
uncertainty_reference_variance  = 0.5
correlation_process_noise_scale = 0.5
correlation_path                = "python/correlation.json"
