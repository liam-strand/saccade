# Expert-system Kalman filter configuration for saccade.
# Usage: cargo b && sudo ./target/debug/saccade --config config/expert.toml run -- <target>
#
# Parameters calibrated from python/sweep_data.h5 (7 benchmarks, 223 events, rates in events/ns).
# Correlation matrix generated by python/expert_correlation.py, which merges the data-driven
# same-batch Pearson r (python/correlation.json) with expert cross-batch correlations grounded
# in AMD Zen micro-architecture semantics.

estimator = "kalman"

[kalman]
# Calibrated from temporal step-variance of compute-bound npb_* benchmarks:
#   ex_ret_instr: Var(z_{t+1}−z_t)/quantum ≈ 0.114 → Q ≈ 1.1e-8/ns
#   ls_dc_accesses: Q ≈ 2.2e-9/ns; geometric mean across events ≈ 1e-8/ns.
# Memory-bound workloads (spec_505_mcf_r) are ~4 decades more variable; those events
# correctly show high uncertainty (large R too) rather than being tracked precisely.
process_noise_per_ns           = 1e-8

# Numerical floor for perfectly stable events (stddev=0 in sweep data).
min_measurement_variance       = 1e-18

# Broad uninformative prior: initial_variance >> worst-case R ≈ 8.8 (burstiest
# memory-bound event), so K₁ ≈ 0.991 and the first measurement is fully trusted.
initial_variance               = 1000.0

# Uncertainty time constant: a well-measured event (R ≈ 0.01) starts at
# uncertainty ≈ 0.02 (confident) and reaches 0.5 after ~5 missed quanta (50 ms).
uncertainty_reference_variance = 0.5

# Expert-augmented correlation matrix: 56 non-zero off-diagonal pairs after PSD
# projection and |r| ≥ 0.1 threshold (39 data-driven same-batch + 17 expert
# cross-batch).  All 39 same-batch pairs preserved exactly.
#
# Cross-batch connections link singleton-batch events only:
#   macro_ops_retired ↔ {ls_not_halted_cyc, op_cache_hit_miss.all, ic_fw32,
#                         de_dis_cops.any_integer, de_dis_cops.any_fp}
#   ls_not_halted_cyc ↔ {de_dis_cops.any_integer, op_cache_hit_miss.all,
#                         ls_dc_accesses, ls_alloc_mab_count}
#   ls_dc_accesses ↔ ls_alloc_mab_count
#   ic_fw32 ↔ op_cache_hit_miss.all
#   bp_l2_btb_correct ↔ {bp_l1_btb_correct, bp_dyn_ind_pred}
correlation_path               = "python/correlation_expert.json"

# Off-diagonal Q per quantum: dP_ij = scale · process_noise_per_ns · elapsed_ns · r_ij.
# 0.5 keeps scale·|r| ≤ 0.5 < 1, preventing rank-deficiency accumulation.
correlation_process_noise_scale = 0.5
